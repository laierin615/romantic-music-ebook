            },
            know(p) {
                const tips = CAT.chapters[p.ci].tips;
                const hint = p.html.includes('table-wrap') ? '<p class="swipe-hint">👉 表格可以左右滑動看完整內容</p>' : '';
                return `${headHtml(p.ci, `📖 知識頁 ${p.k + 1} / ${p.n}`)}
                    <div class="story">${p.html}</div>${hint}
                    ${catBox(tips[p.k] || tips[tips.length - 1] || '')}`;
            },
            music(p) {
                const ch = chaptersData[p.ci];
                const line = ch.mnemonic ? '跟著我念一次：' + ch.mnemonic.replace(/[「」]/g, '') : ch.audioIntro;
                return `${headHtml(p.ci, '🎵 口訣＋音樂')}
                    ${ch.mnemonic ? `<div class="mn-card"><div class="mn-label">💡 記憶口訣</div><p>${ch.mnemonic}</p></div>` : ''}
                    ${catBox(line)}
                    ${ch.audio.length ? `<div class="audio-box"><h3>🎧 示範音樂</h3><p class="audio-note">${ch.audioIntro}<br><small>可愛鐘琴音色的簡化示範，非原曲錄音。播放時黑貓老師會跟著搖擺喔！</small></p>${ch.audio.map(playerHtml).join('')}</div>` : ''}
                    ${ch.formsAudio ? `<div class="audio-box"><h3>🎒 9 種小型曲式點唱機</h3><p class="audio-note">每種曲式各聽一首代表作，邊聽邊回想前面知識頁的「小型曲式百寶袋」！<br><small>都是可愛鐘琴音色的簡化示範（取自公版樂譜），非原曲錄音。</small></p>${ch.formsAudio.map(playerHtml).join('')}</div>` : ''}`;
            },
            comic(p) {
                const ci = p.ci, ch = chaptersData[ci];
                const name = (ch.comicTitle.match(/《.+》/) || [ch.comicTitle])[0];
                return `${headHtml(ci, '🎬 四格漫畫')}
                    <h2 class="comic-name">${name}</h2>
                    ${catBox(CAT.comicStart, { cls: 'compact' })}
                    <div class="comic-grid">${COMICS[ci].map((pn, k) => `
                        <figure class="panel" data-k="${k}">
                            <div class="panel-img">
                                <img src="images/comic_ch${ci + 1}_${k + 1}.jpg" width="500" height="500" alt="第 ${ci + 1} 話四格漫畫第 ${k + 1} 格">
                                <span class="panel-tag">${PANEL_TAGS[k]}</span>
                                <span class="sfx">${pn.sfx}</span>
                            </div>
                            <figcaption class="panel-talk">
                                ${pn.lines.map((l, j) => `<div class="talk show ${j % 2 ? 'r' : 'l'}"><span class="av">${avatar(l[0])}</span><div class="tb"><b>${l[0]}</b><span class="t" data-text="${esc(l[1])}">${l[1]}</span></div></div>`).join('')}
                                <button class="panel-say" onclick="Comic.read(this)" aria-label="朗讀這一格">🔊</button>
                            </figcaption>
                        </figure>`).join('')}</div>
                    <div class="mn-card comic-sum"><div class="mn-label">💡 漫畫重點</div><p>${CAT.chapters[ci].comicDone.replace(/^重點複習：/, '').replace(/喵！?$/, '')}</p></div>
                    <div class="comic-ctrl"><button class="big-btn" onclick="Book.next()">🧠 下一頁：記憶翻牌遊戲 ▶</button></div>`;
            },
            game(p) {
                return `${headHtml(p.ci, '🧠 記憶翻牌遊戲')}
                    <h2 class="comic-name">記憶翻牌大挑戰</h2>
                    ${catBox('翻兩張牌，一張黃色「題目」配一張藍色「答案」，配對成功就會亮起來！全部 6 對找出來喵～', { cls: 'compact' })}
                    <div class="mem-hud"></div>
                    <div class="mem-grid"></div>
                    <div class="mem-end"></div>
                    <div class="center"><button class="ghost-btn small" onclick="Mem.mount(${p.ci}, this.closest('.page'))">🔀 重新洗牌</button></div>`;
            },
            quiz(p) {
                return `${headHtml(p.ci, '📝 闖關測驗')}
                    ${catBox('', { cls: 'compact', mood: 'think' })}
                    <div class="quiz-hud"><div class="q-count"></div><div class="combo"></div><div class="q-dots"></div></div>
                    <div class="q-area"></div>`;
            },
            end() {
                const coins = totalCoins(), stars = totalStars(), rk = rankOf(coins);
                return `<div class="cert"><div class="cert-in">
                        <div class="cert-ribbon">🏅 結業證書</div>
                        <h2>浪漫樂派大冒險<small>初期 ＆ 早期篇</small></h2>
                        <p class="cert-name">冒險家：<span class="line"></span></p>
                        <p>完成了貝多芬、韋伯、羅西尼、舒伯特的<br>早期四大天王冒險！</p>
                        <div class="cert-stats"><div><b>⭐ ${stars}</b><small>/ 24 顆星</small></div><div><b>🪙 ${coins}</b><small>/ 860 音符幣</small></div><div><b>${rk[1]}</b><small>${rk[2]}</small></div></div>
                        <div class="stk-row">${STICKERS.map((s, ci) => { const ok = chapterStars(ci) > 0; return `<span class="${ok ? 'got' : ''}" title="${s[1]}">${ok ? s[0] : '？'}</span>`; }).join('')}</div>
                        <p class="cert-sign">頒發人：🐾 黑貓老師</p>
                    </div></div>
                    ${catBox(CAT.end(stars))}
                    <div class="res-btns"><button class="big-btn" onclick="window.print()">🖨️ 列印證書</button><button class="ghost-btn" onclick="Book.goType('map')">🗺️ 回地圖</button></div>`;
            }
        };

        // 知識頁的對話改成聊天泡泡
        function enhanceDialogs(el) {
            el.querySelectorAll('.intro-dialog p').forEach(pp => {
                const spk = pp.querySelector('.spk');
                if (!spk) return;
                const name = spk.textContent.replace(/[：:]\s*$/, '').trim();
                spk.remove();
                const isCat = /黑貓/.test(name);
                const row = document.createElement('div');
                row.className = 'chat-row ' + (isCat ? 'right' : 'left');
                row.innerHTML = `<span class="av">${isCat ? catHead() : esc(Array.from(name)[0])}</span><div class="chat-b"><b>${esc(name.replace(/^\S+\s/, ''))}</b><div>${pp.innerHTML}</div></div>`;
                pp.replaceWith(row);
            });
        }

        function renderPage(i) {
            const p = PAGES[i];
            const el = document.createElement('section');
            el.className = 'page page-' + p.type;
            if (p.ci != null) el.dataset.ci = p.ci;
            el.style.setProperty('--accent', p.ci != null ? ACCENTS[p.ci] : '#F7D117');
            el.innerHTML = RENDER[p.type](p) + `<div class="page-no">— ${i + 1} —</div><i class="shade"></i>`;
            if (p.type === 'know') enhanceDialogs(el);
            return el;
        }

        function onEnter(p, el) {
            if (!el.isConnected) return;
            if (p.type === 'quiz') { Quiz.mount(p.ci, el); return; }
            if (p.type === 'game' && !el.querySelector('.mem-card')) Mem.mount(p.ci, el);
            const box = el.querySelector('.catbox');
            if (box) Cat.say(box, null, box.dataset.mood || 'normal');
        }

        function prefetch(i) {
            const p = PAGES[i];
            if (!p) return;
            const srcs = [];
            if (p.type === 'title' && chaptersData[p.ci].heroImg) srcs.push(chaptersData[p.ci].heroImg);
            if (p.type === 'comic') for (let k = 1; k <= 4; k++) srcs.push(`images/comic_ch${p.ci + 1}_${k}.jpg`);
            srcs.forEach(s => { const im = new Image(); im.src = s; });
        }

        // ===== 翻頁 =====
        const Book = {
            cur: -1,
            go(i, opts = {}) {
                i = Math.max(0, Math.min(PAGES.length - 1, i));
                if (i === this.cur && !opts.force) return;
                const dir = opts.dir != null ? opts.dir : (this.cur < 0 ? 0 : Math.sign(i - this.cur));
                Synth.stop();
                TTS.stop();
                const stage = $('#stage');
                stage.querySelectorAll('.page.leaving').forEach(p => p.remove());
                const old = stage.querySelector('.page.current');
                if (old) old.querySelectorAll('.catbox').forEach(b => { clearTimeout(b._t); clearTimeout(b._back); });
                const el = renderPage(i);
                el.classList.add('current');
                this.cur = i;
                if (!old || dir === 0 || REDUCED) {
                    if (old) old.remove();
                    stage.appendChild(el);
                } else if (dir > 0) {
                    old.classList.remove('current');
                    old.classList.add('leaving', 'turn-out');
                    stage.insertBefore(el, old);
                    const done = () => old.remove();
                    old.addEventListener('animationend', e => { if (e.target === old) done(); });
                    setTimeout(done, 900);
                } else {
                    old.classList.remove('current');
                    old.classList.add('leaving', 'under');
                    el.classList.add('turn-in');
                    stage.appendChild(el);
                    const done = () => { el.classList.remove('turn-in'); old.remove(); };
                    el.addEventListener('animationend', e => { if (e.target === el) done(); });
                    setTimeout(done, 900);
                }
                if (dir !== 0) {
                    Sfx.flip();
                    if (window.scrollY > 10) window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
                }
                Store.data.page = i;
                Store.save();
                setHash(i);
                updateChrome();
                setTimeout(() => onEnter(PAGES[i], el), dir === 0 ? 120 : 420);
                prefetch(i + 1);
            },
            next() { this.go(this.cur + 1); },
            prev() { this.go(this.cur - 1); },
            goChapter(ci) { this.go(CH_START[ci]); },
            goType(t) { this.go(PAGES.findIndex(p => p.type === t)); }
        };

        function hashFor(i) {
            const p = PAGES[i];
            if (p.type === 'cover') return '';
            if (p.type === 'map') return '#map';
            if (p.type === 'end') return '#end';
            const k = i - CH_START[p.ci];
            return '#ch' + (p.ci + 1) + (k ? '-' + (k + 1) : '');
        }
        function setHash(i) {
            const h = hashFor(i);
            if (location.hash === h || (!h && !location.hash)) return;
            try { history.replaceState(null, '', h || location.pathname + location.search); } catch (e) { /* 忽略 */ }
        }
        function pageFromHash() {
            const h = location.hash;
            if (h === '#map') return 1;
            if (h === '#end') return PAGES.length - 1;
            const m = /^#ch([1-8])(?:-(\d+))?$/.exec(h);
            if (!m) return null;
            const ci = +m[1] - 1;
            const last = ci < 7 ? CH_START[ci + 1] - 1 : PAGES.length - 2;
            return Math.min(CH_START[ci] + (m[2] ? +m[2] - 1 : 0), last);
        }

        function labelFor(p, i) {
            const n = `${i + 1}/${PAGES.length}`;
            if (p.type === 'cover') return '📕 封面　' + n;
            if (p.type === 'map') return '🗺️ 冒險地圖　' + n;
            if (p.type === 'end') return '🏅 結業證書　' + n;
            const names = { title: '關卡開場', know: '知識頁', music: '口訣＋音樂', comic: '四格漫畫', game: '記憶翻牌', quiz: '闖關測驗' };
            return `第 ${p.ci + 1} 關・${names[p.type]}　${n}`;
        }

        function renderBookmarks() {
            $('#bookmarks').innerHTML = `<button class="bm" data-ci="map" style="--c:var(--lemon)" onclick="Book.goType('map')"><b>🗺️ 地圖</b><small>&nbsp;</small></button>` +
                chaptersData.map((c, ci) => `<button class="bm" data-ci="${ci}" style="--c:${ACCENTS[ci]}" onclick="Book.goChapter(${ci})"><b>${ci + 1} ${BM[ci]}</b><small>${starStr(chapterStars(ci))}</small></button>`).join('');
        }

        function updateChrome() {
            const p = PAGES[Book.cur];
            $('#prevBtn').disabled = Book.cur === 0;
            $('#nextBtn').disabled = Book.cur === PAGES.length - 1;
            $('#pgLabel').textContent = labelFor(p, Book.cur);
            $('#pgBar').style.width = ((Book.cur + 1) / PAGES.length * 100).toFixed(1) + '%';
            document.querySelectorAll('.bm').forEach(b => {
                const t = b.dataset.ci;
                const on = p.ci != null ? String(p.ci) === t : (t === 'map' && p.type === 'map');
                b.classList.toggle('active', on);
            });
            const a = document.querySelector('.bm.active');
            const nav = $('#bookmarks');
            if (a) nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: REDUCED ? 'auto' : 'smooth' });
            updateHud();
        }

        function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
        function updateHud() {
            const c = String(totalCoins()), s = String(totalStars());
            const ce = $('#hudCoins'), se = $('#hudStars');
            if (ce.textContent !== c) { const first = ce.textContent === ''; ce.textContent = c; if (!first) bump(ce.parentElement); }
            if (se.textContent !== s) { const first = se.textContent === ''; se.textContent = s; if (!first) bump(se.parentElement); }
        }

        function toast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._h);
            t._h = setTimeout(() => t.classList.remove('show'), 1800);
        }

        function confetti(anchor, count) {
            if (REDUCED) return;
            const fx = $('#fx');
            const r = anchor ? anchor.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 };
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            const em = ['🎵', '⭐', '🎉', '✨', '🎶', '🐾'];
            const n = count || 22;
            for (let k = 0; k < n; k++) {
                const s = document.createElement('span');
                s.className = 'cf';
                s.textContent = em[k % em.length];
                const ang = Math.random() * Math.PI * 2;
                const dist = 60 + Math.random() * (anchor ? 130 : 280);
                s.style.left = cx + 'px';
                s.style.top = cy + 'px';
                s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
                s.style.setProperty('--dy', (Math.sin(ang) * dist - 40).toFixed(0) + 'px');
                s.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
                s.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
                fx.appendChild(s);
                setTimeout(() => s.remove(), 1500);
            }
        }

        // ===== 四格漫畫 =====
        const Comic = {
            read(btn) {
                const panel = btn.closest('.panel');
                const text = [...panel.querySelectorAll('.talk')].map(tk => tk.querySelector('b').textContent + '說：' + tk.querySelector('.t').dataset.text).join('。');
                const page = panel.closest('.page');
                TTS.toggle(text, page.querySelector('.cat'), btn);
            }
        };


        // ===== 記憶翻牌遊戲：每關 6 對（左：題目卡、右：答案卡）=====
        const MEM = [
            [['浪漫的字根', '羅馬'], ['音樂浪漫', '1820–1900 年'], ['文學浪漫', '1830–1850 年'], ['幫「浪漫」取名', '霍夫曼'], ['浪漫開山王', '貝多芬'], ['莫札特後來歸回', '古典時期']],
            [['浪漫樂派重視', '感情與形象'], ['有故事的音樂', '標題音樂'], ['製造驚喜的和聲', '轉調與半音'], ['浪漫先驅', '貝多芬'], ['歌劇王者', '華格納'], ['鋼琴王者', '李斯特']],
            [['第 3 號交響曲', '英雄'], ['第 5 號交響曲', '命運'], ['第 6 號交響曲', '田園'], ['第 9 號交響曲', '合唱'], ['鋼琴奏鳴曲', '36 首'], ['宗教合唱名作', '《莊嚴彌撒》']],
            [['德國第一部浪漫歌劇', '《魔彈射手》'], ['1824 年英國邀請', '《奧伯龍》'], ['鋼琴名曲', '《邀舞》'], ['10 歲的作曲老師', '海頓的弟弟'], ['韋伯的媽媽', '歌手'], ['韋伯的爸爸', '巡迴劇團經理']],
            [['羅西尼的生日', '2 月 29 日'], ['國籍', '義大利'], ['一生寫了', '39 部歌劇'], ['射蘋果的英雄', '《威廉泰爾》'], ['拿剪刀的喜歌劇', '《塞爾維亞的理髮師》'], ['私下的興趣', '美食料理']],
            [['舒伯特的稱號', '歌曲之王'], ['只活了', '31 歲'], ['藝術歌曲', '600 多首'], ['第 8 號交響曲', '《未完成》'], ['小溪裡跳的魚', '《鱒魚》'], ['最崇拜的大師', '貝多芬']],
            [['貝多芬', '樂聖'], ['韋伯', '《魔彈射手》'], ['羅西尼', '歌劇大廚'], ['舒伯特', '歌曲之王'], ['「早期」的下一站', '前期'], ['馬勒、理查·史特勞斯', '後期']]
        ];
        const Mem = {
            mount(ci, page) {
                const pairs = MEM[ci];
                const cards = [];
                pairs.forEach((pr, k) => { cards.push({ k, side: 'q', t: pr[0] }); cards.push({ k, side: 'a', t: pr[1] }); });
                for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
                clearInterval((page._mem || {}).timer);
                const st = page._mem = { ci, cards, open: [], lock: false, moves: 0, found: 0, t0: 0, sec: 0, timer: null, page };
                page.querySelector('.mem-grid').innerHTML = cards.map((c, i) => `<button class="mem-card ${c.side}" data-i="${i}" onclick="Mem.flip(this)" aria-label="翻開第 ${i + 1} 張牌"><span class="mc-in"><span class="mc-back"><b>?</b><small>🐾</small></span><span class="mc-face"><small>${c.side === 'q' ? '題目' : '答案'}</small><b>${c.t}</b></span></span></button>`).join('');
                page.querySelector('.mem-end').innerHTML = '';
                this.hud(st);
            },
            hud(st) {
                const ci = st.ci;
                const m = st.page.querySelector('.mem-hud');
                m.innerHTML = `<span>👆 翻牌 <b>${st.moves}</b> 次</span><span>🧩 配對 <b>${st.found}</b> / ${MEM[ci].length}</span><span>⏱️ <b>${st.sec}</b> 秒</span>`;
            },
            flip(el) {
                const st = el.closest('.page')._mem;
                if (!st || st.lock) return;
                const ci = st.ci, i = +el.dataset.i;
                if (el.classList.contains('open') || el.classList.contains('done')) return;
                if (!st.t0) {
                    st.t0 = Date.now();
                    st.timer = setInterval(() => {
                        if (!st.page.isConnected) { clearInterval(st.timer); return; }
                        st.sec = Math.round((Date.now() - st.t0) / 1000);
                        this.hud(st);
                    }, 1000);
                }
                el.classList.add('open');
                Sfx.pop();
                st.open.push(i);
                if (st.open.length < 2) return;
                st.moves++;
                const [a, b] = st.open.map(x => st.cards[x]);
                const els = st.open.map(x => st.page.querySelector(`.mem-card[data-i="${x}"]`));
                st.open = [];
                const box = st.page.querySelector('.catbox');
                if (a.k === b.k && a.side !== b.side) {
                    st.found++;
                    els.forEach(e => { e.classList.add('done'); e.style.setProperty('--pc', ACCENTS[a.k % ACCENTS.length]); });
                    Sfx.ok();
                    const pr = MEM[ci][a.k];
                    if (st.found < MEM[ci].length) Cat.say(box, `${pick(['配對成功喵！', '答對了！', '好記性喵～', '肉球給你！🐾'])}「${pr[0]}」就是「${pr[1].replace(/[《》]/g, '')}」！`, 'happy');
                    else this.win(st);
                } else {
                    st.lock = true;
                    Sfx.bad();
                    setTimeout(() => { els.forEach(e => e.classList.remove('open')); st.lock = false; }, 950);
                    if (st.moves % 3 === 0) Cat.say(box, pick(['再翻翻看，記住剛剛看到的位置喵！', '沒關係，貓也會記錯喵～', '題目卡是黃色、答案卡是藍色，要一黃一藍才配得起來喵！']), 'think');
                }
                this.hud(st);
            },
            win(st) {
                const ci = st.ci;
                clearInterval(st.timer);
                st.sec = Math.round((Date.now() - st.t0) / 1000);
                this.hud(st);
                const n = MEM[ci].length;
                const grade = st.moves <= n + 2 ? '⭐⭐⭐ 記憶大師' : st.moves <= n * 2 ? '⭐⭐ 記性很好' : '⭐ 全部配對完成';
                Sfx.win();
                confetti(st.page.querySelector('.mem-grid'), 40);
                Cat.say(st.page.querySelector('.catbox'), `全部配對完成！翻了 ${st.moves} 次、${st.sec} 秒，${grade.replace(/⭐+ /, '')}！現在去闖關一定沒問題喵！`, 'happy');
                st.page.querySelector('.mem-end').innerHTML = `<div class="mem-win"><b>${grade}</b><span>翻牌 ${st.moves} 次・${st.sec} 秒</span></div>
                    <div class="comic-ctrl"><button class="big-btn" onclick="Book.next()">📝 去闖關 ▶</button><button class="ghost-btn" onclick="Mem.mount(${ci}, this.closest('.page'))">🔁 再玩一次</button></div>`;
            }
        };

        // ===== 闖關測驗 =====
        function listenHtml(id) {
            return `<div class="player listen-player"><button class="play-btn" data-track="${id}" data-label="🎧 播放題目音樂" onclick="Synth.toggle('${id}', this)">🎧 播放題目音樂（${Math.round(TRACKS[id].dur)} 秒）</button><div class="prog"><i></i></div></div>`;
        }
        const Quiz = {
            state(ci) {
                if (!QS[ci]) QS[ci] = { i: 0, right: 0, combo: 0, ans: [], done: false };
                return QS[ci];
            },
            mount(ci, page) {
                const st = this.state(ci);
                if (st.done) this.showResult(ci, page, false);
                else this.showQ(ci, page, true);
            },
            hud(ci, page) {
                const st = this.state(ci), qs = chaptersData[ci].quizzes;
                page.querySelector('.q-count').innerHTML = st.done ? '🏁 成績單' : `第 <b>${st.i + 1}</b> / ${qs.length} 題`;
                page.querySelector('.q-dots').innerHTML = qs.map((q, k) => {
                    const a = st.ans[k];
                    const cls = a == null ? (k === st.i && !st.done ? 'now' : '') : (a === q.ans ? 'ok' : 'no');
                    return `<i class="${cls}"></i>`;
                }).join('');
                page.querySelector('.combo').textContent = !st.done && st.combo >= 2 ? `🔥 連對 ${st.combo} 題` : '';
            },
            showQ(ci, page, entering) {
                const st = this.state(ci), q = chaptersData[ci].quizzes[st.i], n = chaptersData[ci].quizzes.length;
                this.hud(ci, page);
                page.querySelector('.q-area').innerHTML = `<div class="q-card">
                        <div class="q-text"><span class="q-no">Q${st.i + 1}</span>${q.q}</div>
                        ${q.listen ? listenHtml(q.listen) : ''}
                        <div class="opts">${q.options.map((o, oi) => `<button class="opt opt-${oi}" onclick="Quiz.answer(${ci}, ${oi}, this)"><span class="opt-l">${LETTERS[oi]}</span><span class="opt-t">${o}</span></button>`).join('')}</div>
                        <div class="q-fb" hidden></div>
                        <div class="q-next-row" hidden><button class="big-btn q-next" onclick="Quiz.next(${ci}, this)">${st.i < n - 1 ? '下一題 ▶' : '看成績 🏁'}</button></div>
                    </div>`;
                const box = page.querySelector('.catbox');
                if (st.ans[st.i] != null) { this.paint(ci, page, st.ans[st.i], false); return; }
                const line = st.i === 0 && entering ? CAT.quizStart(ci) : (q.listen ? '先按「播放題目音樂」聽一聽，再選答案喵！' : pick(CAT.thinking));
                Cat.say(box, line, 'think');
            },
            answer(ci, oi, btn) {
                const st = this.state(ci);
                if (st.done || st.ans[st.i] != null) return;
                const q = chaptersData[ci].quizzes[st.i];
                st.ans[st.i] = oi;
                if (oi === q.ans) { st.right += 1; st.combo += 1; } else st.combo = 0;
                Synth.stop();
                TTS.stop();
                this.paint(ci, btn.closest('.page'), oi, true);
                updateHud();
            },
            paint(ci, page, oi, fresh) {
                const st = this.state(ci), q = chaptersData[ci].quizzes[st.i], ok = oi === q.ans;
                page.querySelectorAll('.opt').forEach((b, k) => {
                    b.disabled = true;
                    if (k === q.ans) { b.classList.add('right'); b.querySelector('.opt-l').textContent = '✔'; }
                    if (k === oi && !ok) { b.classList.add('wrong'); b.querySelector('.opt-l').textContent = '✘'; }
                });
                const fb = page.querySelector('.q-fb');
                fb.hidden = false;
                fb.className = 'q-fb ' + (ok ? 'ok' : 'no');
                fb.innerHTML = `<span class="av">${catHead()}</span><div class="fb-txt"><b>${ok ? '✅ 答對了！' : `❌ 正確答案是 ${LETTERS[q.ans]}`}</b><span>${q.exp}</span></div>`;
                const row = page.querySelector('.q-next-row');
                row.hidden = false;
                this.hud(ci, page);
                if (!fresh) return;
                const box = page.querySelector('.catbox');
                if (ok) {
                    Sfx.ok();
                    confetti(page.querySelector('.opt.right'));
                    const pre = st.combo >= 3 ? `連續答對 ${st.combo} 題！🔥 ` : '';
                    Cat.say(box, pre + pick(CAT.cheers) + ' ' + q.exp, 'happy');
                } else {
                    Sfx.bad();
                    Cat.say(box, `${pick(CAT.oops)} 答案是 ${LETTERS[q.ans]}：${q.exp}`, 'sad');
                }
                row.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
            },
            next(ci, btn) {
                const st = this.state(ci), n = chaptersData[ci].quizzes.length;
                const page = btn.closest('.page');
                if (st.i < n - 1) {
                    st.i += 1;
                    this.showQ(ci, page, false);
                    const hud = page.querySelector('.quiz-hud');
                    if (hud.getBoundingClientRect().top < 70) hud.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
                } else {
                    this.finish(ci, page);
                }
            },
            finish(ci, page) {
                const st = this.state(ci);
                st.done = true;
                const prev = Store.data.best[ci];
                if (prev == null || st.right > prev) { Store.data.best[ci] = st.right; Store.save(); }
                renderBookmarks();
                updateChrome();
                this.showResult(ci, page, true);
                const hud = page.querySelector('.quiz-hud');
                if (hud.getBoundingClientRect().top < 70) hud.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
            },
            showResult(ci, page, fresh) {
                const st = this.state(ci), qs = chaptersData[ci].quizzes, n = qs.length;
                const stars = starsFor(st.right, n), bestStars = chapterStars(ci);
                const wrong = qs.map((q, k) => ({ q, a: st.ans[k] })).filter(x => x.a !== x.q.ans);
                const [stk, stkName] = STICKERS[ci];
                this.hud(ci, page);
                page.querySelector('.q-area').innerHTML = `<div class="result">
                        <div class="res-stars">${[0, 1, 2].map(k => `<span class="rs${k < stars ? ' on' : ''}" style="animation-delay:${(0.2 + k * 0.25).toFixed(2)}s">★</span>`).join('')}</div>
                        <div class="res-score">答對 <b>${st.right}</b> / ${n} 題</div>
                        <div class="res-sub">本關最佳：${Store.data.best[ci]} 題・${starStr(bestStars)}</div>
                        ${bestStars > 0 ? `<div class="sticker-get"><span class="stk">${stk}</span><span>獲得貼紙：<b>${stkName}</b></span></div>` : '<div class="sticker-get dim"><span class="stk">🎁</span><span>拿到 1 顆星就能得到貼紙喔！</span></div>'}
                        ${wrong.length ? `<details class="review"><summary>📋 看看答錯的 ${wrong.length} 題</summary><ol>${wrong.map(x => `<li><p>${x.q.q}</p><p class="ans">✅ ${LETTERS[x.q.ans]}. ${x.q.options[x.q.ans]}</p><p class="exp">${x.q.exp}</p></li>`).join('')}</ol></details>` : '<p class="perfect">💯 全部答對，太厲害了！</p>'}
                        <div class="res-btns">
                            <button class="ghost-btn" onclick="Quiz.retry(${ci}, this)">🔁 再挑戰一次</button>
                            ${ci < 7 ? `<button class="big-btn" onclick="Book.goChapter(${ci + 1})">下一關：${SHORT[ci + 1]} ▶</button>` : `<button class="big-btn" onclick="Book.goType('end')">🏅 領取結業證書 ▶</button>`}
                            <button class="ghost-btn" onclick="Book.goType('map')">🗺️ 回地圖</button>
                        </div>
                    </div>`;
                Cat.say(page.querySelector('.catbox'), CAT.result[stars], stars >= 1 ? 'happy' : 'sad');
                if (fresh) {
                    if (stars >= 1) { Sfx.win(); confetti(null, 60); } else Sfx.bad();
                }
            },
            retry(ci, btn) {
                QS[ci] = null;
                const page = btn.closest('.page');
                this.mount(ci, page);
                updateHud();
                const hud = page.querySelector('.quiz-hud');
                if (hud.getBoundingClientRect().top < 70) hud.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
            }
        };

        // ===== 啟動 =====
        const App = {
            resume: 0,
            sfxIcon() { $('#sfxBtn').textContent = Store.data.sfx ? '🔔' : '🔕'; },
            toggleSfx() {
                Store.data.sfx = !Store.data.sfx;
                Store.save();
                this.sfxIcon();
                toast(Store.data.sfx ? '🔔 音效開啟' : '🔕 音效關閉');
            },
            resetAll() {
                if (!window.confirm('要清除這台裝置上的星星、音符幣和貼紙紀錄嗎？')) return;
                Store.data.best = Array(8).fill(null);
                Store.save();
                for (let k = 0; k < QS.length; k++) QS[k] = null;
                renderBookmarks();
                Book.go(Book.cur, { force: true, dir: 0 });
                toast('已清除闖關紀錄');
            },
            init() {
                Store.load();
                this.resume = Store.data.page;
                buildPages();
                renderBookmarks();
                this.sfxIcon();
                const h = pageFromHash();
                Book.go(h != null ? h : 0, { dir: 0 });
                window.addEventListener('hashchange', () => { const i = pageFromHash(); if (i != null && i !== Book.cur) Book.go(i); });
                document.addEventListener('keydown', e => {
                    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
                    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
                    if (e.key === 'ArrowRight') Book.next();
                    else if (e.key === 'ArrowLeft') Book.prev();
                });
                const stage = $('#stage');
                let tx = null;
                stage.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1 || e.target.closest('.table-wrap, .no-swipe')) { tx = null; return; }
                    tx = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
                }, { passive: true });
                stage.addEventListener('touchend', e => {
                    if (!tx) return;
                    const t = e.changedTouches[0];
                    const dx = t.clientX - tx.x, dy = t.clientY - tx.y, dt = Date.now() - tx.t;
                    tx = null;
                    if (dt < 800 && Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 0.6) { if (dx < 0) Book.next(); else Book.prev(); }
                }, { passive: true });
            }
        };
        App.init();
    </script>
</body>
</html>
