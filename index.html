<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>浪漫樂派大冒險｜黑貓老師的音符時光機（初期 ＆ 早期篇）</title>
    <meta name="description" content="國小音樂課互動漫畫電子書：黑貓老師帶你翻頁闖關，認識浪漫樂派早期四大天王貝多芬、韋伯、羅西尼、舒伯特。">
    <meta name="theme-color" content="#F7D117">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%90%88%E2%80%8D%E2%AC%9B%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Huninn&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #222222;
            --ink-2: #555555;
            --paper: #FFFCF0;
            --cream: #9ED9EC;
            --dot: rgba(255,255,255,.6);
            --pink: #F0604D;
            --sky: #6CC3EE;
            --orange: #F6A33A;
            --mint: #5DBB4F;
            --lemon: #F7D117;
            --blue: #4FA3E0;
            --grape: #8A8CF0;
            --coral: #F0604D;
            --bad: #FF9E8F;
            --star: #F7D117;
            --accent: var(--pink);
            --bd: 3px solid var(--ink);
            --outline: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink);
            --outline-s: -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 1px 1px 0 var(--ink);
            color-scheme: light;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Chiron GoRound TC', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            color: var(--ink);
            background-color: var(--cream);
            background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px);
            background-size: 18px 18px;
            font-size: 17px;
            line-height: 1.75;
            min-height: 100vh;
            padding-bottom: calc(86px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }
        button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
        img { max-width: 100%; display: block; }
        .hand { font-family: 'Huninn', 'Chiron GoRound TC', sans-serif; font-weight: 400; }

        /* ===== 頂部列 ===== */
        .topbar { position: sticky; top: 0; z-index: 50; background: var(--lemon); border-bottom: var(--bd); }
        .topbar-in { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 14px; }
        .brand { flex: 1; min-width: 0; text-align: left; font-family: 'Huninn', sans-serif; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hud { display: flex; gap: 6px; align-items: center; }
        .hud-chip { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-weight: 900; font-size: .9rem; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
        .hud-chip.bump { animation: bump .5s ease; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); font-size: 1rem; line-height: 1; }
        @keyframes bump { 30% { transform: scale(1.25) rotate(-4deg); background: var(--mint); } }

        /* ===== 章節書籤 ===== */
        .bookmarks { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 10px; max-width: 880px; margin: 0 auto; scrollbar-width: none; }
        .bookmarks::-webkit-scrollbar { display: none; }
        .bm { flex: 0 0 auto; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px 14px 6px 6px; padding: 3px 12px 2px; font-weight: 700; font-size: .86rem; box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; align-items: center; line-height: 1.3; transition: transform .15s, background .15s; }
        .bm small { font-size: .7rem; letter-spacing: 1px; color: var(--star); text-shadow: var(--outline-s); }
        .bm:hover { transform: translateY(-2px); }
        .bm.active { background: var(--c); transform: translateY(-4px); }

        /* ===== 書本舞台與翻頁 ===== */
        .stage-wrap { max-width: 880px; margin: 0 auto; padding: 2px 14px 24px; }
        .stage { display: grid; perspective: 2200px; }
        .page {
            grid-area: 1 / 1;
            position: relative;
            min-width: 0;
            background: var(--paper);
            border: var(--bd);
            border-radius: 22px;
            box-shadow: 6px 6px 0 var(--ink);
            padding: 34px 18px 20px;
            transform-origin: left center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }
        .page::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 14px;
            background-color: var(--accent);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 10px, transparent 10px 20px);
            border-bottom: 3px solid var(--ink);
        }
        .page::after {
            content: "";
            position: absolute;
            right: -3px;
            bottom: -3px;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--cream) 0 50%, var(--accent) 50%);
            border-left: 3px solid var(--ink);
            border-top: 3px solid var(--ink);
            border-radius: 12px 0 22px 0;
        }
        .page.leaving { pointer-events: none; }
        .page.turn-out { z-index: 3; animation: turnOut .62s cubic-bezier(.45,.05,.55,.95) forwards; }
        .page.turn-in { z-index: 3; animation: turnIn .62s cubic-bezier(.45,.05,.55,.95) both; }
        .page.under { z-index: 1; }
        .shade { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: linear-gradient(90deg, rgba(43,35,64,0), rgba(43,35,64,.4)); opacity: 0; }
        .page.turn-out .shade { animation: shadeIn .62s forwards; }
        .page.turn-in .shade { animation: shadeOut .62s forwards; }
        @keyframes turnOut { from { transform: rotateY(0); } to { transform: rotateY(-112deg); box-shadow: 40px 10px 40px rgba(43,35,64,.18); } }
        @keyframes turnIn { from { transform: rotateY(-112deg); } to { transform: rotateY(0); } }
        @keyframes shadeIn { to { opacity: 1; } }
        @keyframes shadeOut { from { opacity: 1; } to { opacity: 0; } }
        .page-no { text-align: center; color: #9AA9B5; font-size: .82rem; margin-top: 20px; font-weight: 700; }

        /* ===== 下方翻頁列 ===== */
        .pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--paper); border-top: var(--bd); padding: 9px 12px calc(9px + env(safe-area-inset-bottom)); }
        .pager-in { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
        .pg-btn { min-width: 58px; height: 54px; padding: 0 16px; border-radius: 18px; border: var(--bd); background: var(--sky); box-shadow: 4px 4px 0 var(--ink); font-weight: 900; font-size: 1.05rem; white-space: nowrap; transition: transform .1s, box-shadow .1s; }
        .pg-btn.next { background: var(--pink); }
        .pg-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .pg-btn:disabled { opacity: .35; cursor: default; }
        .pg-info { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: .86rem; }
        .pg-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pg-bar { height: 10px; border: 2.5px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; margin-top: 3px; }
        .pg-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, var(--mint) 0 8px, #7FCF6F 8px 16px); transition: width .4s; }
        @media (max-width: 560px) { .pg-btn span { display: none; } }

        /* ===== 共用按鈕 ===== */
        .big-btn, .ghost-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border-radius: 16px; border: var(--bd); box-shadow: 4px 4px 0 var(--ink); font-weight: 900; font-size: 1.04rem; transition: transform .1s, box-shadow .1s; }
        .big-btn { background: var(--accent); }
        .ghost-btn { background: #fff; }
        .big-btn:hover, .ghost-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
        .big-btn:active, .ghost-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
        .ghost-btn.small { font-size: .86rem; padding: 7px 14px; box-shadow: 3px 3px 0 var(--ink); }
        .center { text-align: center; margin-top: 18px; }

        /* ===== 黑貓老師 ===== */
        .catbox { display: flex; align-items: flex-end; gap: 12px; margin: 18px 0 6px; }
        .cat { width: 100px; flex: 0 0 100px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .catbox.compact { margin-top: 4px; }
        .catbox.compact .cat { width: 78px; flex-basis: 78px; }
        @media (min-width: 720px) { .cat { width: 124px; flex-basis: 124px; } .catbox.compact .cat { width: 92px; flex-basis: 92px; } }
        .cat svg { width: 100%; height: auto; overflow: visible; display: block; }
        .bubble { position: relative; flex: 1; min-width: 0; background: #fff; border: var(--bd); border-radius: 20px; padding: 10px 14px 10px; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 26px; cursor: pointer; }
        .bubble::before { content: ""; position: absolute; left: -19px; bottom: 14px; border-style: solid; border-width: 9px 18px 9px 0; border-color: transparent var(--ink) transparent transparent; }
        .bubble::after { content: ""; position: absolute; left: -13px; bottom: 17px; border-style: solid; border-width: 6px 13px 6px 0; border-color: transparent #fff transparent transparent; }
        .bubble-name { font-size: .74rem; font-weight: 900; color: var(--ink-2); letter-spacing: 1px; }
        .bubble-text { font-family: 'Huninn', sans-serif; font-size: 1.1rem; line-height: 1.6; min-height: 1.6em; word-break: break-word; }
        .caret { display: inline-block; width: 2px; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: caret .6s steps(2) infinite; }
        @keyframes caret { 50% { opacity: 0; } }
        .say-btn { margin-top: 6px; font-size: .82rem; font-weight: 900; background: var(--lemon); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 11px; box-shadow: 2px 2px 0 var(--ink); }
        .say-btn.on { background: var(--mint); }

        .cat .tail { transform-origin: 140px 196px; animation: tail 2.6s ease-in-out infinite; }
        .cat .body { transform-origin: 100px 230px; animation: breathe 3.2s ease-in-out infinite; }
        .cat .head { transform-origin: 100px 136px; transition: transform .3s; }
        .cat .eyes-open { transform-origin: 100px 92px; animation: blink 4.8s infinite; }
        .cat .pupil { transition: transform .25s; }
        .cat .arm { transform-origin: 128px 170px; }
        .cat .mouth-open { transform-origin: 100px 115px; opacity: 0; }
        .cat .eyes-happy, .cat .sad-bits, .cat .think-q, .cat .sparkle { display: none; }
        .cat.talking .mouth-open { opacity: 1; animation: talk .22s ease-in-out infinite alternate; }
        .cat.talking .mouth-closed { opacity: 0; }
        .cat.talking .head { animation: nod .5s ease-in-out infinite alternate; }
        .cat.talking .arm { animation: baton .45s ease-in-out infinite alternate; }
        .cat[data-mood="happy"] .eyes-open { display: none; }
        .cat[data-mood="happy"] .eyes-happy, .cat[data-mood="happy"] .sparkle { display: inline; }
        .cat[data-mood="happy"] svg { animation: hop .55s ease 2; }
        .cat[data-mood="happy"] .sparkle { animation: twinkle .8s ease-in-out infinite alternate; transform-origin: center; }
        .cat[data-mood="sad"] .sad-bits { display: inline; }
        .cat[data-mood="sad"] .head { transform: rotate(-7deg) translateY(4px); }
        .cat[data-mood="sad"] .pupil { transform: translateY(4px); }
        .cat[data-mood="sad"] svg { animation: shake .45s ease 1; }
        .cat[data-mood="think"] .think-q { display: inline; animation: bob 1s ease-in-out infinite alternate; }
        .cat[data-mood="think"] .pupil { transform: translate(3px, -5px); }
        .cat.pop svg { animation: popIn .6s cubic-bezier(.2,1.5,.4,1) both; }
        body.music-on .cat svg { animation: dance .42s ease-in-out infinite alternate; }
        .think-q { font: 900 40px 'Huninn', sans-serif; fill: var(--lemon); stroke: #15101F; stroke-width: 2.5px; paint-order: stroke fill; }
        @keyframes tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
        @keyframes breathe { 50% { transform: scale(1.025, .985); } }
        @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
        @keyframes talk { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
        @keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
        @keyframes baton { from { transform: rotate(6deg); } to { transform: rotate(-16deg); } }
        @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) rotate(-4deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
        @keyframes twinkle { from { opacity: .4; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(.3) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes dance { from { transform: rotate(-5deg); } to { transform: rotate(5deg) translateY(-6px); } }

        /* ===== 頁首小標 ===== */
        .page-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { background: var(--accent); border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-weight: 900; font-size: .84rem; box-shadow: 2px 2px 0 var(--ink); }
        .ph-r { font-family: 'Huninn', sans-serif; font-size: 1.05rem; }
        .ch-title { font-family: 'Huninn', sans-serif; font-weight: 400; font-size: clamp(1.45rem, 4.8vw, 2.1rem); line-height: 1.35; margin: 4px 0 14px; }

        /* ===== 封面 ===== */
        .cover-top { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .tag { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-weight: 700; font-size: .85rem; box-shadow: 2px 2px 0 var(--ink); }
        .cover-h { font-family: 'Huninn', sans-serif; font-weight: 400; text-align: center; line-height: 1.15; margin: 12px 0 18px; }
        .cover-h .l1 { display: block; font-size: clamp(1.1rem, 3.8vw, 1.5rem); color: var(--ink-2); }
        .cover-h .l2 { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 10px; font-size: clamp(1.7rem, 7.6vw, 3rem); }
        .tile { display: grid; place-items: center; width: 1.45em; height: 1.45em; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); line-height: 1; animation: tileBob 2.4s ease-in-out infinite; }
        .tile:nth-child(5n+1) { background: #333; color: #fff; transform: rotate(-4deg); }
        .tile:nth-child(5n+2) { background: #F2E6B8; transform: rotate(3deg) translateY(6px); }
        .tile:nth-child(5n+3) { background: var(--pink); color: #fff; transform: rotate(-2deg); }
        .tile:nth-child(5n+4) { background: #333; color: #fff; transform: rotate(4deg) translateY(-4px); }
        .tile:nth-child(5n) { background: var(--mint); color: #fff; transform: rotate(-3deg) translateY(4px); }
        .tile:nth-child(odd) { animation-delay: -1.2s; }
        @keyframes tileBob { 50% { translate: 0 -4px; } }
        .cover-h .l3 { display: inline-block; margin-top: 12px; font-size: 1.02rem; background: var(--sky); border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 16px; box-shadow: 3px 3px 0 var(--ink); }
        @keyframes wobble { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) scale(1.02); } }
        .frame { border: var(--bd); border-radius: 18px; overflow: hidden; box-shadow: 5px 5px 0 var(--ink); background: #fff; margin: 0; }
        .frame img { width: 100%; height: auto; }
        .frame figcaption { padding: 8px 12px; font-size: .92rem; border-top: 3px solid var(--ink); background: #FFF7E0; }
        .frame.tilt { transform: rotate(-1.2deg); }
        .feat { list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 16px 0 6px; }
        .feat li { background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 8px; font-weight: 700; font-size: .92rem; box-shadow: 3px 3px 0 var(--ink); text-align: center; }
        .feat li:nth-child(1) { background: #FFE1DC; } .feat li:nth-child(2) { background: #DDF3FF; } .feat li:nth-child(3) { background: #E2F6DC; }
        .feat li:nth-child(4) { background: #FFF3C4; } .feat li:nth-child(5) { background: #FFE9CC; } .feat li:nth-child(6) { background: #E2F6DC; }
        @media (min-width: 640px) { .feat { grid-template-columns: repeat(3, 1fr); } }
        .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 18px 0 12px; }
        .cta .big-btn { font-size: 1.2rem; padding: 13px 26px; background: var(--pink); }
        .tip { font-size: .86rem; color: var(--ink-2); text-align: center; line-height: 1.65; }

        /* ===== 冒險地圖 ===== */
        .rank-card { display: flex; gap: 12px; align-items: center; background: linear-gradient(135deg, #FFF2B0, #CFEFFF); border: var(--bd); border-radius: 18px; padding: 12px 14px; box-shadow: 4px 4px 0 var(--ink); margin: 4px 0 18px; }
        .rank-ico { font-size: 2.4rem; width: 64px; height: 64px; border-radius: 50%; background: #fff; border: var(--bd); display: grid; place-items: center; flex: 0 0 64px; }
        .rank-main { flex: 1; min-width: 0; }
        .rank-name b { font-family: 'Huninn', sans-serif; font-weight: 400; font-size: 1.25rem; }
        .rank-meta { font-size: .9rem; font-weight: 700; }
        .rank-bar { height: 12px; border: 2.5px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; margin: 6px 0 2px; }
        .rank-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lemon), var(--orange)); }
        .rank-next { font-size: .8rem; color: var(--ink-2); }
        .levels { list-style: none; position: relative; display: flex; flex-direction: column; gap: 14px; padding: 6px 0; }
        .levels::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; border-left: 4px dashed #B9C9D6; transform: translateX(-2px); }
        .lv { position: relative; width: min(80%, 400px); }
        .lv.l { align-self: flex-start; } .lv.r { align-self: flex-end; }
        .lv-btn { width: 100%; display: flex; align-items: center; gap: 10px; background: #fff; border: var(--bd); border-radius: 18px; padding: 8px 12px; box-shadow: 4px 4px 0 var(--ink); text-align: left; transition: transform .12s; }
        .lv-btn:hover { transform: translate(-2px, -2px) rotate(-1deg); }
        .lv-num { flex: 0 0 46px; height: 46px; border-radius: 50%; background: var(--c); border: var(--bd); display: grid; place-items: center; font-family: 'Huninn', sans-serif; font-size: 1.4rem; }
        .lv-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
        .lv-txt b { font-size: 1.02rem; }
        .lv-txt small { color: var(--star); font-size: 1rem; letter-spacing: 2px; text-shadow: var(--outline-s); }
        .lv-stk { font-size: 1.6rem; }
        .sticker-book { margin-top: 18px; background: #fff; border: var(--bd); border-radius: 18px; padding: 12px; box-shadow: 4px 4px 0 var(--ink); }
        .sticker-book h3 { font-family: 'Huninn', sans-serif; font-weight: 400; font-size: 1.2rem; margin-bottom: 8px; }
        .stk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .stk-slot { border: 2.5px dashed #BFB3D6; border-radius: 14px; padding: 8px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9A8FB3; }
        .stk-slot span { font-size: 1.8rem; line-height: 1.2; }
        .stk-slot small { font-size: .72rem; line-height: 1.25; }
        .stk-slot.got { border: 2.5px solid var(--ink); background: #FFF6D6; color: var(--ink); box-shadow: 2px 2px 0 var(--ink); transform: rotate(-3deg); }
        .stk-slot.got:nth-child(even) { transform: rotate(3deg); }

        /* ===== 關卡開場 ===== */
        .stage-banner { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .st-l { font-family: 'Huninn', sans-serif; letter-spacing: 3px; background: var(--ink); color: var(--lemon); padding: 1px 10px; border-radius: 8px; }
        .st-n { font-family: 'Huninn', sans-serif; font-size: 2.4rem; line-height: 1; color: var(--accent); text-shadow: var(--outline), 3px 3px 0 var(--ink); }
        .st-tag { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: .85rem; }
        .st-stars { margin-left: auto; color: var(--star); font-size: 1.35rem; letter-spacing: 2px; text-shadow: var(--outline-s); }

        /* ===== 知識頁 ===== */

        .table-wrap { overflow-x: auto; border: var(--bd); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink); background: #fff; -webkit-overflow-scrolling: touch; }
        table.summary { border-collapse: collapse; min-width: 660px; width: 100%; font-size: .95rem; line-height: 1.55; }
        .summary th { background: var(--accent); font-family: 'Huninn', sans-serif; font-weight: 400; padding: 8px 10px; border-bottom: 3px solid var(--ink); text-align: left; white-space: nowrap; }

        /* ===== 頭像 ===== */
        .av { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); font-size: 1.25rem; line-height: 1; overflow: hidden; }

        /* ===== 口訣＋音樂 ===== */
        .mn-card { position: relative; background: var(--lemon); border: var(--bd); border-radius: 18px; padding: 14px 16px; box-shadow: 5px 5px 0 var(--ink); transform: rotate(-.8deg); margin: 6px 0 4px; }

        .audio-desc { font-size: .88rem; color: var(--ink-2); line-height: 1.55; }

        .listen-player { background: #F2FBFF; margin: 0 0 14px; }

        /* ===== 四格漫畫 ===== */
        .comic-name { font-family: 'Huninn', sans-serif; font-weight: 400; text-align: center; font-size: clamp(1.35rem, 4.6vw, 1.8rem); margin: 0 0 6px; }
        .comic-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 10px; }
        @media (min-width: 700px) { .comic-grid { grid-template-columns: 1fr 1fr; } }
        .panel { margin: 0; background: #fff; border: var(--bd); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); overflow: hidden; scroll-margin: 80px 0 110px; }
        .panel-img { position: relative; aspect-ratio: 1 / 1; background: #F3EEFA; overflow: hidden; }
        .panel .sfx { animation: sfxPop .5s cubic-bezier(.2,1.6,.4,1) .3s both; }
        .panel-img img { width: 100%; height: 100%; object-fit: cover; }
        .panel-tag { position: absolute; left: 8px; top: 8px; background: var(--accent); border: 2.5px solid var(--ink); border-radius: 10px; font-family: 'Huninn', sans-serif; font-size: 1.1rem; padding: 0 10px; box-shadow: 2px 2px 0 var(--ink); }

        .pc-q-unused { width: 86px; height: 86px; border-radius: 50%; background: #fff; border: var(--bd); display: grid; place-items: center; box-shadow: 4px 4px 0 var(--ink); font-family: 'Huninn', sans-serif; font-size: 3.2rem; line-height: 1; animation: bob 1.1s ease-in-out infinite alternate; }
        @keyframes sfxPop { from { transform: rotate(-8deg) scale(0); } to { transform: rotate(-8deg) scale(1); } }
        .panel-talk { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px 10px 12px; background: #FFFDF7; border-top: 3px solid var(--ink); }
        .talk { display: flex; gap: 8px; align-items: flex-start; opacity: 0; transform: scale(.7); transform-origin: left top; transition: opacity .25s, transform .3s cubic-bezier(.2,1.5,.4,1); }

        .tb { position: relative; background: #fff; border: 2.5px solid var(--ink); border-radius: 16px; padding: 5px 11px 6px; box-shadow: 2px 2px 0 var(--ink); max-width: calc(100% - 50px); }
        .talk.r .tb { background: #FFF6CC; }
        .tb::before { content: ""; position: absolute; top: 11px; left: -10px; border-style: solid; border-width: 6px 9px 6px 0; border-color: transparent var(--ink) transparent transparent; }
        .talk.r .tb::before { left: auto; right: -10px; border-width: 6px 0 6px 9px; border-color: transparent transparent transparent var(--ink); }
        .tb > b { display: block; font-size: .72rem; color: var(--ink-2); line-height: 1.3; }
        .tb .t { font-family: 'Huninn', sans-serif; font-size: 1.04rem; line-height: 1.5; }
        .panel-say { position: absolute; right: 10px; top: -21px; width: 38px; height: 38px; border-radius: 50%; background: var(--lemon); border: 2.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); font-size: 1rem; line-height: 1; }
        .panel-say.on { background: var(--mint); }
        .comic-ctrl { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

        /* ===== 闖關測驗 ===== */
        .quiz-hud { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin: 4px 0 12px; scroll-margin-top: 80px; }
        .q-count { font-weight: 900; font-size: 1.02rem; }
        .q-count b { font-size: 1.4rem; }
        .combo { font-weight: 900; color: #E8590C; }
        .q-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
        .q-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; }

        .q-dots i.ok { background: var(--mint); }
        .q-dots i.no { background: var(--bad); }
        .q-card { background: #fff; border: var(--bd); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); padding: 16px 14px; animation: popIn .4s ease both; }
        .q-text { font-size: 1.14rem; font-weight: 700; line-height: 1.6; margin-bottom: 14px; }
        .q-no { display: inline-block; background: var(--accent); border: 2.5px solid var(--ink); border-radius: 10px; padding: 0 8px; margin-right: 8px; font-family: 'Huninn', sans-serif; font-weight: 400; box-shadow: 2px 2px 0 var(--ink); }
        .opts { display: grid; gap: 10px; }
        .opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 14px; border: var(--bd); border-radius: 16px; background: var(--o); box-shadow: 4px 4px 0 var(--ink); font-weight: 700; font-size: 1.02rem; line-height: 1.5; transition: transform .1s, box-shadow .1s, opacity .2s; }
        .opt-0 { --o: #FFE1DC; } .opt-1 { --o: #DDF3FF; } .opt-2 { --o: #E2F6DC; } .opt-3 { --o: #FFF3C4; }
        .opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
        .opt:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

        .opt.right { background: var(--mint); animation: boing .5s ease; }
        .opt.wrong { background: var(--bad); animation: shake .45s ease; }
        .opt:disabled:not(.right):not(.wrong) { opacity: .5; }
        @keyframes boing { 30% { transform: scale(1.05); } 60% { transform: scale(.97); } }
        .q-fb { margin-top: 14px; border: 2.5px dashed var(--ink); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
        .q-fb.ok { background: #E3FBEF; } .q-fb.no { background: #FFECEE; }
        .q-fb .fb-txt { display: flex; flex-direction: column; }
        .q-next-row { margin-top: 14px; text-align: right; scroll-margin-bottom: 110px; }
        .result { text-align: center; background: #fff; border: var(--bd); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); padding: 18px 14px; animation: popIn .45s ease both; }
        .res-stars { font-size: 3.4rem; line-height: 1.1; letter-spacing: 6px; }
        .rs { color: #E6DFF2; text-shadow: var(--outline); display: inline-block; }

        @keyframes starPop { from { transform: scale(0) rotate(-90deg); } to { transform: none; } }
        .res-score { font-size: 1.2rem; font-weight: 900; margin-top: 4px; }

        .res-sub { font-size: .9rem; color: var(--ink-2); }
        .sticker-get { display: inline-flex; align-items: center; gap: 10px; margin: 12px 0 4px; background: #FFF6D6; border: 2.5px solid var(--ink); border-radius: 16px; padding: 6px 14px 6px 8px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }

        .review { text-align: left; margin-top: 14px; border: 2.5px solid var(--ink); border-radius: 14px; background: #FFFDF7; }

        .res-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }

        /* ===== 結業證書 ===== */
        .cert { border: 4px solid var(--ink); border-radius: 22px; background: #FFFBEA; box-shadow: 6px 6px 0 var(--ink); padding: 10px; }
        .cert-in { border: 3px dashed #E0B84A; border-radius: 16px; padding: 20px 14px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }

        .cert h2 small { display: block; font-size: 1rem; color: var(--ink-2); }
        .cert-name { font-size: 1.1rem; }
        .cert-name .line { display: inline-block; width: 9em; border-bottom: 2.5px solid var(--ink); vertical-align: -4px; }
        .cert-stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .stk-row span { width: 46px; height: 46px; border-radius: 50%; border: 2.5px dashed #C9BDE0; display: grid; place-items: center; font-size: 1.4rem; color: #B3A7CC; }

        /* ===== 特效 ===== */
        #fx { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
        .cf { position: absolute; font-size: 22px; animation: cf 1.25s cubic-bezier(.2,.7,.3,1) forwards; }
        @keyframes cf { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 90px)) rotate(var(--rot)); opacity: 0; } }
        #toast { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -16px); opacity: 0; background: var(--ink); color: #fff; padding: 8px 18px; border-radius: 999px; font-weight: 700; z-index: 120; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (min-width: 720px) {
            body { font-size: 18px; }
            .page { padding: 38px 32px 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
        @media print {
            body { background: #fff; padding: 0; }
            .topbar, .bookmarks, .pager, .catbox, .res-btns, .page-no, #fx, #toast { display: none !important; }
            .page { border: none; box-shadow: none; }
            .page::before, .page::after { display: none; }
        }

        /* ===== 撞色卡片風（覆寫） ===== */
        .feat li { color: var(--ink); }
        .feat li:nth-child(1) { background: var(--pink); } .feat li:nth-child(2) { background: var(--sky); } .feat li:nth-child(3) { background: var(--lemon); }
        .feat li:nth-child(4) { background: var(--mint); } .feat li:nth-child(5) { background: var(--orange); } .feat li:nth-child(6) { background: var(--grape); }
        .feat li:nth-child(odd) { transform: rotate(-1.2deg); } .feat li:nth-child(even) { transform: rotate(1.2deg); }
        .bubble-name { margin: -10px -14px 7px; padding: 3px 14px; background: var(--accent); color: var(--ink); border-bottom: 3px solid var(--ink); border-radius: 17px 17px 0 0; }
        .story > ul > li { border-width: 3px; box-shadow: 4px 4px 0 var(--ink); background: var(--cb, #fff); }
        .story > ul > li:nth-child(6n+1) { --cb: #FFD9D2; } .story > ul > li:nth-child(6n+2) { --cb: #CFEBFA; } .story > ul > li:nth-child(6n+3) { --cb: #FFF0A8; }
        .story > ul > li:nth-child(6n+4) { --cb: #D3F0CB; } .story > ul > li:nth-child(6n+5) { --cb: #FFDDB0; } .story > ul > li:nth-child(6n) { --cb: #DCDDFC; }
        .story > ul > li::before { background: var(--ink); color: var(--lemon); border-color: var(--ink); }
        .story > ul > li:nth-child(odd) { transform: rotate(-.4deg); } .story > ul > li:nth-child(even) { transform: rotate(.4deg); }
        .story strong { background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
        .chat-b { background: var(--sky); border-width: 3px; }
        .chat-row.right .chat-b { background: var(--lemon); }
        .chat-b > b { color: var(--ink); }
        .frame figcaption { background: var(--lemon); font-weight: 700; }
        .mission { background: var(--lemon); border: var(--bd); box-shadow: 4px 4px 0 var(--ink); }
        .mission span { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; }
        .st-tag { background: var(--sky); }
        .rank-card { background: var(--sky); }
        .rank-ico { background: var(--lemon); }
        .rank-next, .rank-meta { color: var(--ink); }
        .lv-btn { background: var(--c); }
        .lv-num { background: #fff; }
        .lv-txt small { color: #fff; }
        .sticker-book { background: var(--mint); }
        .stk-slot { background: rgba(255,255,255,.55); border-color: var(--ink); color: var(--ink); }
        .stk-slot.got { background: var(--lemon); }
        .player { border-width: 3px; box-shadow: 5px 5px 0 var(--ink); }
        .audio-box .player:nth-of-type(6n+1) { background: var(--lemon); } .audio-box .player:nth-of-type(6n+2) { background: var(--sky); } .audio-box .player:nth-of-type(6n+3) { background: var(--mint); }
        .audio-box .player:nth-of-type(6n+4) { background: var(--orange); } .audio-box .player:nth-of-type(6n+5) { background: var(--pink); } .audio-box .player:nth-of-type(6n) { background: var(--grape); }
        .audio-desc { color: var(--ink); }
        .play-btn { background: #fff; }
        .play-btn.playing { background: var(--ink); color: var(--lemon); }
        .prog { background: #fff; }
        .prog i { background: repeating-linear-gradient(45deg, var(--ink) 0 8px, #555 8px 16px); }
        .listen-player { background: var(--sky); }
        .panel-talk { background: var(--accent); }
        .comic-sum { margin-top: 18px; transform: rotate(.6deg); }
        .q-card { background: var(--paper); border-top: 14px solid var(--accent); }
        .opt-0 { --o: var(--pink); } .opt-1 { --o: var(--sky); } .opt-2 { --o: var(--lemon); } .opt-3 { --o: var(--orange); }
        .opt.right { background: var(--mint); }

        .result { border-top: 14px solid var(--accent); }
        .sticker-get { background: var(--lemon); }
        .q-fb.ok { background: #D3F0CB; } .q-fb.no { background: #FFD9D2; }
        .q-fb { border-style: solid; box-shadow: 3px 3px 0 var(--ink); }
        .table-wrap { box-shadow: 4px 4px 0 var(--ink); }
        .summary tbody tr:nth-child(odd) td { background: #FFF6D0; }

        /* ===== 記憶翻牌 ===== */
        .mem-hud { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 6px 0 12px; }
        .mem-hud span { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-weight: 700; font-size: .92rem; box-shadow: 2px 2px 0 var(--ink); }

        // ===== Web Audio 合成器：雙聲部示範音樂 =====
        const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

        function midiOf(name) {
            const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
            if (!m) throw new Error('音名格式錯誤：' + name);
            return 12 * (Number(m[3]) + 1) + NOTE_BASE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
        }

        // 記譜格式：「音名:拍數」，r 為休止，A3+C4 為和弦，| 只是小節線方便閱讀
        function parseSeq(text) {
            let t = 0;
            const notes = [];
            text.trim().split(/\s+/).forEach(tok => {
                if (!tok || tok === '|') return;
                const i = tok.lastIndexOf(':');
                const pitch = tok.slice(0, i);
                const dur = parseFloat(tok.slice(i + 1));
                if (pitch !== 'r') {
                    pitch.split('+').forEach(n => {
                        notes.push({ f: 440 * Math.pow(2, (midiOf(n) - 69) / 12), t, d: dur });
                    });
                }
                t += dur;
            });
            return { notes, len: t };
        }

        // 三連音分解和弦（像流水一樣的伴奏）
        function rip(chord, beats) {
            const ns = chord.split(' ');
            const out = [];
            const n = Math.round(beats * 3);
            for (let i = 0; i < n; i++) out.push(ns[i % ns.length] + ':0.333333');
            return out.join(' ');
        }

            return Array(times).fill(seq).join(' ');

                const med = fs.length ? fs[Math.floor(fs.length / 2)] : 440;
                const oct = v.oct != null ? v.oct : (v.kind === 'bell' ? (med < 400 ? 1 : 0) : (med < 130 ? 1 : 0));
                v.mul = Math.pow(2, oct);

        const Synth = {
            ctx: null,
            master: null,
            cur: null,

            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                    const comp = this.ctx.createDynamicsCompressor();
                    this.master = this.ctx.createGain();
                    this.master.gain.value = 0.9;
                    this.master.connect(comp);
                    comp.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },

            toggle(id, btn) {
                if (this.cur && this.cur.btn === btn) { this.stop(); return; }
                this.play(id, btn);
            },

            play(id, btn) {
                this.stop();
                this.init();
                const tr = TRACKS[id];
                const ctx = this.ctx;
                const bus = ctx.createGain();
                bus.connect(this.master);
                const spb = 60 / tr.bpm;
                const t0 = ctx.currentTime + 0.08;
                const nodes = [];
                tr.voices.forEach(v => {
                    v.parsed.notes.forEach(n => {
                        const s = t0 + n.t * spb;
                        const d = n.d * spb;
                        const f = n.f * v.mul;
                        if (v.kind === 'bell') {
                            // 可愛鐘琴：FM 合成（金屬感泛音快速消失）＋高八度的亮點
                            const tau = Math.min(0.9, Math.max(0.22, 0.16 + d * 0.45));
                            const car = ctx.createOscillator();
                            car.type = 'sine';
                            car.frequency.value = f;
                            const mod = ctx.createOscillator();
                            mod.type = 'sine';
                            mod.frequency.value = f * 3.5;
                            const mg = ctx.createGain();
                            mg.gain.setValueAtTime(f * 1.6, s);
                            mg.gain.setTargetAtTime(f * 0.08, s, 0.09);
                            mod.connect(mg);
                            mg.connect(car.frequency);
                            const g = ctx.createGain();
                            g.gain.setValueAtTime(0.0001, s);
                            g.gain.linearRampToValueAtTime(v.vol, s + 0.004);
                            g.gain.setTargetAtTime(0.0001, s + 0.004, tau);
                            car.connect(g);
                            g.connect(bus);
                            const sp = ctx.createOscillator();
                            sp.type = 'sine';
                            sp.frequency.value = f * 2;
                            const sg = ctx.createGain();
                            sg.gain.setValueAtTime(0.0001, s);
                            sg.gain.linearRampToValueAtTime(v.vol * 0.22, s + 0.003);
                            sg.gain.setTargetAtTime(0.0001, s + 0.003, tau * 0.35);
                            sp.connect(sg);
                            sg.connect(bus);
                            const end = s + tau * 6;
                            [car, mod, sp].forEach(o => { o.start(s); o.stop(end); nodes.push(o); });
                        } else {
                            // 木琴般圓潤的低音
                            const tau = Math.min(0.6, Math.max(0.15, 0.12 + d * 0.3));
                            const o = ctx.createOscillator();
                            o.type = 'triangle';
                            o.frequency.value = f;
                            const g = ctx.createGain();
                            g.gain.setValueAtTime(0.0001, s);
                            g.gain.linearRampToValueAtTime(v.vol * 1.25, s + 0.006);
                            g.gain.setTargetAtTime(0.0001, s + 0.006, tau);
                            o.connect(g);
                            g.connect(bus);
                            o.start(s);
                            o.stop(s + tau * 6);
                            nodes.push(o);
                        }
                    });
                });
                const total = tr.dur;
                this.cur = { id, btn, bus, nodes, t0, total, timer: null };
                this.ui(btn, true, total, total);
                this.cur.timer = setInterval(() => {
                    const left = total - (ctx.currentTime - t0);
                    if (left <= 0) { this.stop(); return; }
                    this.ui(btn, true, left, total);
                }, 200);
            },

            stop() {
                const c = this.cur;
                if (!c) return;
                clearInterval(c.timer);
                const now = this.ctx.currentTime;
                c.bus.gain.setTargetAtTime(0, now, 0.03);
                c.nodes.forEach(o => { try { o.stop(now + 0.15); } catch (err) { /* 已排定停止 */ } });
                setTimeout(() => c.bus.disconnect(), 400);
                this.cur = null;
                this.ui(c.btn, false);
            },

            ui(btn, playing, left, total) {
                const id = btn.dataset.track;
                const secs = Math.round(TRACKS[id].dur);
                const idle = btn.dataset.label + '（' + secs + ' 秒）';
                btn.classList.toggle('playing', playing);
                btn.textContent = playing ? '■ 停止（剩 ' + Math.max(1, Math.min(secs, Math.ceil(left))) + ' 秒）' : idle;
                const box = btn.closest('.player');
                const bar = box ? box.querySelector('.prog i') : null;
                if (bar) bar.style.width = playing ? (100 * (1 - left / total)).toFixed(1) + '%' : '0';
            }
        };

</svg>`;
        }
        const catHead = () => '<svg class="av-cat" viewBox="26 10 148 144" aria-hidden="true"><use href="#catHead"/></svg>';
        const avatar = name => name === '黑貓老師' ? catHead() : (AV[name] || '💬');

        function catBox(text, opts = {}) {
            return `<div class="catbox${opts.cls ? ' ' + opts.cls : ''}" data-say="${esc(text)}" data-mood="${opts.mood || 'normal'}">
                <div class="cat pop" data-mood="${opts.mood || 'normal'}" onclick="Cat.poke(this)" role="img" aria-label="黑貓老師">${catSvg()}</div>
                <div class="bubble" onclick="Cat.skip(this)">
                    <div class="bubble-name">🐾 黑貓老師</div>
                    <div class="bubble-text"></div>
                    <button class="say-btn" onclick="event.stopPropagation(); Cat.speak(this)">🔊 念給我聽</button>
                </div>
            </div>`;
        }

        // ===== 朗讀（瀏覽器內建語音） =====
        let VOICE = null;
        function pickVoice() {
            if (VOICE) return VOICE;
            const vs = window.speechSynthesis.getVoices();
            VOICE = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh[-_](Hant|HK)/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
            return VOICE;
        }
        function cleanTTS(s) {
            return String(s).replace(/\p{Extended_Pictographic}|️|‍/gu, '')
                .replace(/2\/29/g, '2月29日').replace(/[–—]{1,2}/g, '到').replace(/‧/g, '、').replace(/[【】～]/g, '');
        }
        const TTS = {
            ok: 'speechSynthesis' in window,
            cur: null,
            speak(text, cat, btn) {
                if (!this.ok) { toast('這個瀏覽器不支援朗讀功能'); return; }
                this.stop();
                Synth.stop();
                const u = new SpeechSynthesisUtterance(cleanTTS(text));
                u.lang = 'zh-TW';
                const v = pickVoice();
                if (v) u.voice = v;
                u.rate = 1;
                u.pitch = 1.3;
                const st = { cat, btn, label: btn ? btn.innerHTML : '' };
                st.end = () => {
                    const mine = this.cur === st;
                    if (mine) this.cur = null;
                    if (btn) { btn.classList.remove('on'); btn.innerHTML = st.label; }
                    const box = cat && cat.closest('.catbox');
                    if (cat && (mine || !this.cur || this.cur.cat !== cat) && !(box && box._t)) cat.classList.remove('talking');
                };
                u.onend = st.end;
                u.onerror = st.end;
                this.cur = st;
                if (cat) cat.classList.add('talking');
                if (btn) { btn.classList.add('on'); btn.innerHTML = '⏹ 停止'; }
                window.speechSynthesis.speak(u);
            },
            stop() {
                if (!this.ok) return;
                const c = this.cur;
                window.speechSynthesis.cancel();
                if (c) c.end();
            },
            toggle(text, cat, btn) {
                if (this.cur && this.cur.btn === btn) { this.stop(); return; }
                this.speak(text, cat, btn);
            }
        };
        if (TTS.ok) window.speechSynthesis.onvoiceschanged = () => { VOICE = null; };

        // ===== 黑貓老師動畫解說 =====
        const Cat = {
            say(box, text, mood) {
                if (!box) return;
                if (text != null) box.dataset.say = text;
                text = box.dataset.say || '';
                const cat = box.querySelector('.cat');
                const out = box.querySelector('.bubble-text');
                clearTimeout(box._t);
                box._t = null;
                clearTimeout(box._back);
                box._poking = false;
                cat.classList.remove('pop');
                cat.dataset.mood = mood || 'normal';
                const svg = cat.querySelector('svg');
                svg.style.animation = 'none';
                void svg.getBoundingClientRect();
                svg.style.animation = '';
                const chars = Array.from(text);
                if (REDUCED || !chars.length) { out.textContent = text; return; }
                out.textContent = '';
                cat.classList.add('talking');
                const caret = document.createElement('span');
                caret.className = 'caret';
                let i = 0;
                const step = () => {
                    i += 1;
                    out.textContent = chars.slice(0, i).join('');
                    if (i >= chars.length) { this.finish(box); return; }
                    out.appendChild(caret);
                    box._t = setTimeout(step, /[，。！？、～…：]/.test(chars[i - 1]) ? 170 : 45);
                };
                box._t = setTimeout(step, 140);
            },
            finish(box) {
                clearTimeout(box._t);
                box._t = null;
                const out = box.querySelector('.bubble-text');
                out.textContent = box.dataset.say || '';
                const cat = box.querySelector('.cat');
                if (!(TTS.cur && TTS.cur.cat === cat)) cat.classList.remove('talking');
            },
            skip(bubble) {
                const box = bubble.closest('.catbox');
                if (box && box._t) this.finish(box);
            },
            speak(btn) {
                const box = btn.closest('.catbox');
                TTS.toggle(box.dataset.say, box.querySelector('.cat'), btn);
            },
            poke(cat) {
                const box = cat.closest('.catbox');
                if (!box) return;
                const orig = box._poking ? box._orig : { text: box.dataset.say, mood: cat.dataset.mood };
                Sfx.pop();
                this.say(box, pick(CAT.pokes), 'happy');
                box._poking = true;
                box._orig = orig;
                box._back = setTimeout(() => {
                    if (box.isConnected && box._poking) this.say(box, orig.text, orig.mood === 'happy' ? 'normal' : orig.mood);
                }, 3800);
            }
        };

        // ===== 音效 =====
        const Sfx = {
            tone(freqs, type, dur, gap, vol) {
                if (!Store.data.sfx) return;
                try {
                    Synth.init();
                    const ctx = Synth.ctx;
                    const t0 = ctx.currentTime + 0.01;
                    freqs.forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = type;
                        o.frequency.value = f;
                        o.connect(g);
                        g.connect(Synth.master);
                        const s = t0 + i * gap;
                        g.gain.setValueAtTime(0.0001, s);
                        g.gain.exponentialRampToValueAtTime(vol, s + 0.012);
                        g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
                        o.start(s);
                        o.stop(s + dur + 0.05);
                    });
                } catch (e) { /* 不支援音效時略過 */ }
            },
            ok() { this.tone([784, 1175], 'triangle', 0.18, 0.09, 0.22); },
            bad() { this.tone([220, 175], 'square', 0.2, 0.13, 0.06); },
            win() { this.tone([523, 659, 784, 1047], 'triangle', 0.24, 0.11, 0.2); },
            pop() { this.tone([1046], 'sine', 0.09, 0, 0.14); },
            flip() {
                // 翻紙聲：紙張摩擦的沙沙聲（帶通濾波掃頻＋細碎的紙纖維聲）＋落下的輕拍
                if (!Store.data.sfx) return;
                try {
                    Synth.init();
                    const ctx = Synth.ctx;
                    const sr = ctx.sampleRate;
                    const now = ctx.currentTime + 0.01;
                    const len = Math.floor(sr * 0.42);
                    const buf = ctx.createBuffer(1, len, sr);
                    const d = buf.getChannelData(0);
                    let crackle = 0;
                    for (let i = 0; i < len; i++) {
                        const t = i / sr;
                        const env = t < 0.3 ? Math.pow(Math.sin(Math.PI * t / 0.3), 1.4) : 0;
                        if (Math.random() < 0.004) crackle = 1;
                        crackle *= 0.93;
                        d[i] = (Math.random() * 2 - 1) * (env * 0.8 + crackle * 0.9 * (env + 0.15));
                        if (t > 0.3 && t < 0.36) d[i] += (Math.random() * 2 - 1) * Math.pow(1 - (t - 0.3) / 0.06, 3) * 0.9;
                    }
                    const src = ctx.createBufferSource();
                    src.buffer = buf;
                    const hp = ctx.createBiquadFilter();
                    hp.type = 'highpass';
                    hp.frequency.value = 450;
                    const bp = ctx.createBiquadFilter();
                    bp.type = 'bandpass';
                    bp.Q.value = 0.6;
                    bp.frequency.setValueAtTime(1100, now);
                    bp.frequency.exponentialRampToValueAtTime(4200, now + 0.26);
                    bp.frequency.exponentialRampToValueAtTime(1500, now + 0.36);
                    const g = ctx.createGain();
                    g.gain.value = 0.55;
                    src.connect(hp);
                    hp.connect(bp);
                    bp.connect(g);
                    g.connect(Synth.master);
                    src.start(now);
                } catch (e) { /* 不支援音效時略過 */ }
            }
        };

        // 播放示範音樂時，黑貓老師跟著搖擺
        const synthPlay = Synth.play.bind(Synth);
        const synthStop = Synth.stop.bind(Synth);
        Synth.play = function (id, btn) { TTS.stop(); synthPlay(id, btn); document.body.classList.add('music-on'); };
        Synth.stop = function () { synthStop(); document.body.classList.remove('music-on'); };

        // ===== 進度存檔（只存在這台裝置） =====
        const Store = {
            key: 'romanticEbook.v2',
            data: { best: Array(8).fill(null), page: 0, sfx: true },
            load() {
                try {
                    const s = JSON.parse(localStorage.getItem(this.key) || 'null');
                    if (s && typeof s === 'object') {
                        if (Array.isArray(s.best) && s.best.length === 8) this.data.best = s.best.map(v => (typeof v === 'number' ? v : null));
                        if (typeof s.page === 'number') this.data.page = s.page;
                        if (typeof s.sfx === 'boolean') this.data.sfx = s.sfx;
                    }
                } catch (e) { /* 無法讀取時用預設值 */ }
            },
            save() {
                try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* 無法存檔時略過 */ }
            }
        };

        // ===== 成績計算 =====
        const QS = chaptersData.map(() => null);
        const starsFor = (right, total) => { const r = right / total; return r >= 0.9 ? 3 : r >= 0.7 ? 2 : r >= 0.5 ? 1 : 0; };
        const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
        function chapterStars(ci) { const b = Store.data.best[ci]; return b == null ? 0 : starsFor(b, chaptersData[ci].quizzes.length); }
        function bestRight(ci) { return Math.max(Store.data.best[ci] || 0, QS[ci] ? QS[ci].right : 0); }
        function totalCoins() { return chaptersData.reduce((s, _, i) => s + bestRight(i) * 10, 0); }
        function totalStars() { return chaptersData.reduce((s, _, i) => s + chapterStars(i), 0); }
        function rankOf(c) { let r = RANKS[0]; RANKS.forEach(x => { if (c >= x[0]) r = x; }); return r; }

        // ===== 頁面清單 =====
        const PAGES = [];
        const CH_START = [];
        function splitContent(html) {
            const parts = html.split(/(?=<h3>)/).map(s => s.trim()).filter(s => s.replace(/<[^>]+>/g, '').trim());
            const pages = [];
            let cur = '', len = 0;
            parts.forEach(p => {
                const l = p.replace(/<[^>]+>/g, '').replace(/\s+/g, '').length;
                if (cur && len + l > 260) { pages.push(cur); cur = ''; len = 0; }
                cur += p;
                len += l;
            });
            if (cur) pages.push(cur);
            return pages;
        }
        function buildPages() {
            PAGES.push({ type: 'cover' }, { type: 'map' });
            chaptersData.forEach((ch, ci) => {
                CH_START[ci] = PAGES.length;
                PAGES.push({ type: 'title', ci });
                if (ci < 7) splitContent(ch.content).forEach((html, k, arr) => PAGES.push({ type: 'know', ci, html, k, n: arr.length }));
                if (ch.audio.length || ch.mnemonic) PAGES.push({ type: 'music', ci });
                if (COMICS[ci]) PAGES.push({ type: 'comic', ci });
                if (MEM[ci]) PAGES.push({ type: 'game', ci });
                PAGES.push({ type: 'quiz', ci });
            });
            PAGES.push({ type: 'end' });
        }

        // ===== 各種頁面 =====
        const headHtml = (ci, label) => `<div class="page-head"><span class="chip">STAGE ${ci + 1}・${SHORT[ci]}</span><span class="ph-r">${label}</span></div>`;
        const RENDER = {
            cover() {
                const r = App.resume;
                return `<div class="cover-top"><span class="tag">🎵 國小音樂課</span><span class="tag">📖 互動漫畫電子書</span></div>
                    <h1 class="cover-h"><span class="l1">穿越音符時光機！</span><span class="l2">${'浪漫樂派大冒險'.split('').map(c => `<b class="tile">${c}</b>`).join('')}</span><span class="l3">初期 ＆ 早期篇</span></h1>
                    <figure class="frame tilt"><img src="images/hero_cover.jpg" width="1200" height="896" alt="封面插圖：小樂站在古典鋼琴前，穿過 1820 年的金色音符大門，就是充滿故事與色彩的浪漫世界"></figure>
                    ${catBox(CAT.cover)}
                    <ul class="feat">${['🗺️ 8 關冒險地圖', '🎬 28 格搞笑漫畫', '🔔 27 首鐘琴示範曲', '📝 86 題闖關', '🧠 7 關記憶翻牌', '🐾 黑貓老師陪讀'].map(t => `<li>${t}</li>`).join('')}</ul>
                    <div class="cta"><button class="big-btn" onclick="Book.goType('map')">🚀 開始冒險</button>${r > 1 && r < PAGES.length ? `<button class="ghost-btn" onclick="Book.go(${r})">📖 從第 ${r + 1} 頁繼續</button>` : ''}</div>
                    <p class="tip">👆 翻頁：按下方 ◀ ▶、手機左右滑、鍵盤方向鍵都可以。<br>🔈 iPhone／iPad 請先關閉「靜音模式」，才聽得到音樂和朗讀。</p>`;
            },
            map() {
                const coins = totalCoins(), stars = totalStars(), rk = rankOf(coins), nx = RANKS.find(r => r[0] > coins);
                const pct = nx ? Math.round((coins - rk[0]) / (nx[0] - rk[0]) * 100) : 100;
                return `<div class="page-head"><span class="chip">🗺️ 冒險地圖</span><span class="ph-r">選一關出發！</span></div>
                    <div class="rank-card"><div class="rank-ico">${rk[1]}</div><div class="rank-main">
                        <div class="rank-name">目前稱號：<b>${rk[2]}</b></div>
                        <div class="rank-meta">🪙 ${coins} 枚音符幣・⭐ ${stars} / 24 顆星</div>
                        <div class="rank-bar"><i style="width:${pct}%"></i></div>
                        <div class="rank-next">${nx ? `再 ${nx[0] - coins} 枚升級成「${nx[2]}」` : '已經是最高稱號了！'}</div>
                    </div></div>
                    <ol class="levels">${chaptersData.map((c, ci) => {
                        const s = chapterStars(ci);
                        return `<li class="lv ${ci % 2 ? 'r' : 'l'}"><button class="lv-btn" style="--c:${ACCENTS[ci]}" onclick="Book.goChapter(${ci})"><span class="lv-num">${ci + 1}</span><span class="lv-txt"><b>${SHORT[ci]}</b><small>${starStr(s)}</small></span><span class="lv-stk">${s > 0 ? STICKERS[ci][0] : '🎁'}</span></button></li>`;
                    }).join('')}</ol>
                    ${catBox(CAT.map())}
                    <div class="sticker-book"><h3>🌟 我的貼紙簿</h3><div class="stk-grid">${STICKERS.map((s, ci) => {
                        const ok = chapterStars(ci) > 0;
                        return `<div class="stk-slot${ok ? ' got' : ''}"><span>${ok ? s[0] : '？'}</span><small>${ok ? s[1] : '第 ' + (ci + 1) + ' 關'}</small></div>`;
                    }).join('')}</div></div>
                    <div class="center"><button class="ghost-btn small" onclick="App.resetAll()">🧹 清除這台裝置的闖關紀錄</button></div>`;
            },
            title(p) {
                const ci = p.ci, ch = chaptersData[ci];
                const stage = (ch.kicker.match(/【[^】]+】/) || [''])[0];
                const knowN = PAGES.filter(x => x.ci === ci && x.type === 'know').length;
                const steps = [];
                if (knowN) steps.push(`📖 讀 ${knowN} 頁`);
                if (ch.audio.length) steps.push(`🎧 聽 ${ch.audio.length + (ch.formsAudio || []).length} 首`);
                if (COMICS[ci]) steps.push('🎬 看漫畫');
                if (MEM[ci]) steps.push('🧠 翻牌');
                steps.push(`📝 闖關 ${ch.quizzes.length} 題`);
                const hero = ch.heroImg
                    ? `<figure class="frame"><img src="${ch.heroImg}" width="1200" height="896" alt="${esc(ch.heroCap.replace('▲ ', ''))}"><figcaption>${ch.heroCap}</figcaption></figure>`
                    : `<div class="boss"><div class="trophy">🏆</div><b>最終關卡：16 題大魔王</b><span>📖 全冊重點 12 題 ＋ 🎧 聽音辨曲 4 題</span></div>`;
                return `<div class="stage-banner"><span class="st-l">STAGE</span><span class="st-n">${ci + 1}</span>${stage ? `<span class="st-tag">${stage}</span>` : ''}<span class="st-stars">${starStr(chapterStars(ci))}</span></div>
                    <h2 class="ch-title">${ch.title}</h2>

                    ${catBox(CAT.chapters[ci].intro)}
